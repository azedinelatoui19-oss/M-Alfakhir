<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام السحب على الخصومات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>🎁 نظام السحب على الخصومات</h1>
                <p class="subtitle">احصل على خصم بسهولة!</p>
            </div>

            <form id="drawForm" class="form">
                <div class="form-group">
                    <label for="phone">رقم الهاتف:</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        placeholder="0655787605"
                        required
                        pattern="[0-9+]{10,}"
                    >
                    <small>أدخل رقمك بصيغة صحيحة (مثال: 0655787605)</small>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary">
                    <span id="btnText">احصل على خصمك الآن</span>
                    <span id="btnLoader" class="loader hidden"></span>
                </button>
            </form>

            <!-- عرض النتيجة -->
            <div id="resultContainer" class="result-container hidden">
                <div id="resultBox" class="result-box"></div>
            </div>

            <!-- رسائل الخطأ -->
            <div id="errorContainer" class="error-container hidden">
                <div id="errorBox" class="error-box"></div>
            </div>

            <!-- معلومات مفيدة -->
            <div class="info-box">
                <h3>💡 كيف يعمل النظام؟</h3>
                <ul>
                    <li>📱 أدخل رقم هاتفك</li>
                    <li>✅ اضغط "احصل على خصمك"</li>
                    <li>🎉 ستحصل على خصم حسب الحظ</li>
                    <li>⚠️ كل رقم هاتف يسحب مرة واحدة فقط</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
