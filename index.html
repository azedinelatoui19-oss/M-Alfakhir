<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مناحل الفاخر</title>
    <style>
        body { font-family: sans-serif; background: #fdfbf7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; padding: 40px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); text-align: center; max-width: 350px; border: 2px solid #d4af37; }
        input { width: 90%; padding: 12px; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 10px; direction: ltr; }
        .btn { background: #25d366; color: white; border: none; padding: 15px 30px; border-radius: 50px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>مناحل الفاخر</h1>
        <label>أدخل رقم هاتفك لتسجيل الطلب:</label>
        <input type="tel" id="phone" placeholder="06XXXXXXXX">
        <button class="btn" onclick="sendToWhatsApp()">إرسال عبر واتساب</button>
    </div>

    <script>
        function sendToWhatsApp() {
            var phone = document.getElementById('phone').value;
            // ضع رقم هاتفك الشخصي هنا (مع رمز الدولة، مثلاً 213)
            var myNumber = "213655787605"; 
            var url = "https://wa.me/" + myNumber + "?text=مرحباً، أريد التسجيل في السحب، رقم هاتفي هو: " + phone;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
