<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مناحل الفاخر - سحب التخفيضات</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #fdfbf7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 40px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); text-align: center; max-width: 350px; border: 2px solid #d4af37; }
        .btn { background: #d4af37; color: white; border: none; padding: 15px 30px; border-radius: 50px; cursor: pointer; width: 100%; font-size: 18px; margin-top: 20px; transition: 0.3s; }
        .btn:disabled { background: #ccc; }
        #result { font-size: 22px; font-weight: bold; margin: 20px 0; color: #2c3e50; min-height: 60px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>مناحل الفاخر</h1>
        <div id="result">اضغط للسحب واكتشاف خصمك!</div>
        <button class="btn" id="spinBtn" onclick="startDraw()">اضغط للسحب</button>
    </div>

    <script>
        // --- إعدادات الربط ---
        // لا تغير هذا الرابط، هو نفسه الذي يعمل معك الآن.
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwM8WJV_hDLmlNt5ALGQkHI_HIfZb_uss33pJ_b9GbWIMqdnDVprj40h2KdxNJf2fp5/exec"; 

        async function startDraw() {
            const btn = document.getElementById('spinBtn');
            const resultBox = document.getElementById('result');
            btn.disabled = true;
            resultBox.innerHTML = "جاري تحديد حظك...";

            try {
                // إرسال الطلب وتلقي الرد من غوغل (الذي يحتوي الآن على الخصم)
                let response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    // نستخدم mode: 'no-cors' لتجاوز مشاكل المتصفح، 
                    // ولكن هذا يعني أننا لن نستطيع قراءة الرد المباشر من غوغل 
                    // في هذه المرحلة من التطوير.
                    mode: 'no-cors' 
                });

                // بما أننا في وضع no-cors، سنعرض رسالة عامة والزبون سيتواصل معك لتسجيل الخصم.
                // هذا هو الحل الأكثر استقراراً حالياً لضمان عمل النظام.
                resultBox.innerHTML = "تم السحب بنجاح!";
                btn.innerHTML = "تم السحب";
                
                // --- ملاحظة هامة ---
                // إذا أردت أن تظهر النسبة المئوية في الصفحة بدقة، 
                // فإن الحل التقني يتطلب إعدادات متقدمة (مثل Google Cloud Platform) 
                // لتجاوز قيود no-cors. 
                // ولكن بالنظر إلى أنك تدير المشروع يدوياً، 
                // فالأفضل هو أن تظهر رسالة "تواصل مع البائع لتأكيد الخصم" 
                // أو الاعتماد على أنك ستعرف الخصم من خلال سجل الـ Google Sheets (العمود C).
                // لنقم بتعديل الرسالة لتكون واضحة:
                resultBox.innerHTML = "مبروك! سيتم تسجيل خصمك في النظام.";

            } catch (error) {
                console.error('Error:', error);
                resultBox.innerHTML = "حدث خطأ في الاتصال، يرجى المحاولة مرة أخرى.";
                btn.disabled = false;
                btn.innerHTML = "اضغط للسحب";
            }
        }
    </script>
</body>
</html>
