<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مناحل الفاخر - سحب التخفيضات</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #fdfbf7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 40px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); text-align: center; max-width: 350px; border: 2px solid #d4af37; }
        .btn { background: #d4af37; color: white; border: none; padding: 15px 30px; border-radius: 50px; cursor: pointer; width: 100%; font-size: 18px; margin-top: 20px; transition: 0.3s; }
        .btn:disabled { background: #ccc; }
        #result { font-size: 22px; font-weight: bold; margin: 20px 0; color: #2c3e50; min-height: 60px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>مناحل الفاخر</h1>
        <div id="result">اضغط للسحب واكتشاف خصمك!</div>
        <button class="btn" id="spinBtn" onclick="startDraw()">اضغط للسحب</button>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwwEpDNbvXx16Dqqxi7Py4fSgwTEXcgzzEf251s0445HtOJ9SM__IAbi1Cb6MsvuKAC/exec";

        async function startDraw() {
            const btn = document.getElementById('spinBtn');
            const resultBox = document.getElementById('result');
            btn.disabled = true;
            resultBox.innerHTML = "جاري التحقق من الحظ...";

            try {
                // إرسال طلب للسيرفر لزيادة العداد في غوغل شيت
                let response = await fetch(SCRIPT_URL, {method: 'POST'});
                let data = await response.json();
                let count = data.count;

                // نظام التوزيع الجديد بناءً على العداد الكلي:
                // من 1 إلى 20 -> 20%
                // من 21 إلى 40 -> 30%
                // من 41 إلى 60 -> 40%
                // من 61 إلى 80 -> 50%
                // من 81 إلى 100 فما فوق -> 100%
                let discount = "20%";
                if (count <= 20) {
                    discount = "20%";
                } else if (count <= 40) {
                    discount = "30%";
                } else if (count <= 60) {
                    discount = "40%";
                } else if (count <= 80) {
                    discount = "50%";
                } else {
                    discount = "100%";
                }

                resultBox.innerHTML = `مبروك! خصمك هو ${discount} 🎉`;
                btn.innerHTML = "تم السحب بنجاح";
            } catch (e) {
                resultBox.innerHTML = "حدث خطأ في الاتصال، حاول مرة أخرى!";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
